<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">

  <!-- Shield -->
  <path d="M155,40 L345,40 L345,220 Q345,320 250,360 Q155,320 155,220 Z" fill="#0c2340"/>
  <!-- Gold top bar -->
  <rect x="155" y="40" width="190" height="12" fill="#d4a843"/>
  <!-- Gold left border -->
  <line x1="155" y1="40" x2="155" y2="220" stroke="#d4a843" stroke-width="2.5"/>
  <!-- Gold right border -->
  <line x1="345" y1="40" x2="345" y2="220" stroke="#d4a843" stroke-width="2.5"/>

  <!-- T letter centered in shield -->
  <text x="250" y="245" text-anchor="middle" fill="white" font-size="130" font-weight="700" font-family="Georgia, serif">T</text>

  <!-- Gold arc at bottom of shield -->
  <path d="M178,278 Q250,308 322,278" stroke="#d4a843" stroke-width="3" fill="none"/>

  <!-- TRESAS -->
  <text x="250" y="410" text-anchor="middle" fill="#0c2340" font-size="46" font-weight="700" font-family="Georgia, serif" letter-spacing="6">ST. THERESA'S</text>

  <!-- Gold lines beside TRESAS -->
  <line x1="155" y1="418" x2="210" y2="418" stroke="#d4a843" stroke-width="1.8"/>
  <line x1="290" y1="418" x2="345" y2="418" stroke="#d4a843" stroke-width="1.8"/>

  <!-- MATRICULATION SCHOOL -->
  <text x="250" y="438" text-anchor="middle" fill="#0c2340" font-size="13" font-weight="600" letter-spacing="4" font-family="Arial, sans-serif">MATRIC.</text>
  <text x="250" y="456" text-anchor="middle" fill="#0c2340" font-size="13" font-weight="600" letter-spacing="4" font-family="Arial, sans-serif">(HR. SEC. SCHOOL)</text>

  <!-- Location -->
  <text x="250" y="478" text-anchor="middle" fill="#999999" font-size="12" font-family="Arial, sans-serif" letter-spacing="1">Nagercoil · Tamil Nadu</text>
</svg>
